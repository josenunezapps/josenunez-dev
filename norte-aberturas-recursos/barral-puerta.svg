<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 780" role="img" aria-labelledby="title desc">
<title id="title">Barral tirador vertical para puerta</title><desc id="desc">Ilustración arquitectónica de un barral de acero satinado montado en una puerta de madera moderna.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eeede5"/><stop offset="1" stop-color="#c7cec6"/></linearGradient>
 <linearGradient id="wood" x2="1"><stop stop-color="#645045"/><stop offset=".32" stop-color="#806652"/><stop offset=".68" stop-color="#92735a"/><stop offset="1" stop-color="#60483d"/></linearGradient>
 <linearGradient id="steel" x2="1"><stop stop-color="#343f3d"/><stop offset=".11" stop-color="#a4adab"/><stop offset=".31" stop-color="#fbfefd"/><stop offset=".55" stop-color="#9ba8a6"/><stop offset=".8" stop-color="#4b5352"/><stop offset="1" stop-color="#272f2c"/></linearGradient>
 <linearGradient id="mount" x2="1"><stop stop-color="#525e5b"/><stop offset=".47" stop-color="#d3dad5"/><stop offset="1" stop-color="#45514f"/></linearGradient>
 <linearGradient id="shade" x2="1"><stop stop-color="#000" stop-opacity=".22"/><stop offset=".16" stop-color="#000" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".23"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="17"/></filter>
 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>

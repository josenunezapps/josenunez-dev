name: Build Arven JDK 17 Runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/arven-jdk17-runtime.yml"
      - "tools/arven-jdk/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jdk17-aarch64:
    name: Arven JDK 17 · arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Build Arven JDK 17 runtime
        run: |
          chmod +x tools/arven-jdk/build-arven-jdk17.sh
          tools/arven-jdk/build-arven-jdk17.sh aarch64 "$GITHUB_WORKSPACE/.arven-jdk-build"

      - name: Publish permanent runtime release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: arven-jdk17-v1
          name: Arven JDK 17 Runtime
          body: Runtime JDK 17 para Arven IDE. Descarga automática interna de la app.
          target_commitish: main
          overwrite_files: true
          files: |
            .arven-jdk-build/output/arven-jdk17-aarch64.zip
            .arven-jdk-build/output/arven-jdk17-aarch64.zip.sha256
            .arven-jdk-build/output/build-info.txt
          fail_on_unmatched_files: true

name: DistraGuard Android Shorts – APK de prueba

on:
  push:
    branches:
      - prototype/distraguard-android-shorts
    paths:
      - "distraguard-android-poc/**"
      - ".github/workflows/distraguard-android-shorts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test de reglas de Shorts
        run: |
          mkdir -p distraguard-android-poc/build/smoke
          javac -d distraguard-android-poc/build/smoke \
            distraguard-android-poc/app/src/main/java/com/josenunezapps/distraguard/shortsprobe/ShortsDetector.java \
            distraguard-android-poc/tests/ShortsDetectorSmokeTest.java
          java -cp distraguard-android-poc/build/smoke ShortsDetectorSmokeTest
      - name: Construir APK debug
        run: gradle -p distraguard-android-poc :app:assembleDebug --no-daemon
      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: DistraGuard-Shorts-Prueba-APK
          path: distraguard-android-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

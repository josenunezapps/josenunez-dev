<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zenix AR · Mantenimiento</title>
<meta name="description" content="Zenix AR está realizando mejoras en su sitio web.">
<meta name="theme-color" content="#07060d">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.18),transparent 34%),
    radial-gradient(circle at 80% 75%,rgba(34,211,238,.10),transparent 30%),
    #07060d;
  color:#f5f3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{width:min(680px,100%);text-align:center}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:44px;font-weight:850;font-size:24px;letter-spacing:-.04em}
.logo img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(139,92,246,.35))}
.logo b{color:#8b5cf6;margin-left:4px}
.status{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(139,92,246,.25);border-radius:999px;background:rgba(139,92,246,.08);color:#c4b5fd;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px}
.status i{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 14px rgba(34,211,238,.8);animation:pulse 1.8s ease-in-out infinite}
h1{font-size:clamp(42px,9vw,82px);line-height:.95;letter-spacing:-.055em;margin-bottom:24px}
h1 span{background:linear-gradient(90deg,#c4b5fd,#8b5cf6 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
p{max-width:560px;margin:0 auto;color:rgba(245,243,255,.68);font-size:clamp(17px,3vw,20px);line-height:1.55}
.actions{margin-top:34px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:14px;text-decoration:none;font-weight:750;color:#fff;border:1px solid rgba(139,92,246,.32);background:linear-gradient(135deg,#6d3df5,#8b5cf6);box-shadow:0 16px 40px -20px rgba(109,61,245,.9)}
small{display:block;margin-top:38px;color:rgba(245,243,255,.38);font-size:12px;letter-spacing:.04em}
@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}
@media(prefers-reduced-motion:reduce){.status i{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="assets/logo-zx.webp" alt=""><span>Zenix<b>AR</b></span></div>
  <div class="status"><i></i> Mantenimiento</div>
  <h1>Estamos haciendo <span>mejoras.</span></h1>
  <p>Estamos trabajando en una nueva versión de nuestro sitio. Volvemos pronto.</p>
  <div class="actions">
    <a href="https://wa.me/5492901471353?text=Hola%20Zenix!%20Quiero%20hacer%20una%20consulta." target="_blank" rel="noopener">Contactar por WhatsApp</a>
  </div>
  <small>© 2026 Zenix AR · Soluciones digitales</small>
</main>
</body>
</html>
